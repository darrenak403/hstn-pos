[package]
name = "seafood-pos"
version = "0.0.1"
edition = "2021"

# Chỉ build desktop (không có target mobile), nên dùng src/main.rs làm binary
# mặc định — không cần khai báo [lib] trỏ tới src/lib.rs không tồn tại.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
# Bọc OS credential vault thật (Keychain/Credential Manager/Secret Service) —
# KHÔNG dùng tauri-plugin-store (JSON plaintext). Xem src/secrets.rs.
keyring = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
